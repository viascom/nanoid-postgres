name: Feature request
description: Suggest a new function, parameter or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current functions do not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How the function or parameter should behave, ideally with an example call and its result.
      render: sql
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and parity
      description: Workarounds you considered, and whether nanoid-mysql-mariadb, nanoid-kotlin or ai/nanoid already offer this.
